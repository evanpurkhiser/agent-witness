name: Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (example: 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6.0.3
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version input
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semver like 0.2.0"
            exit 1
          fi

      - name: Ensure tag does not already exist
        run: |
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi

      - name: Ensure checks are passing on the release base
        run: |
          SHA=$(git rev-parse HEAD)
          for workflow in lint.yml test.yml build.yml; do
            RUN_ID=$(gh run list --workflow="$workflow" --branch=main --event=push \
              --commit "$SHA" --limit=1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -z "$RUN_ID" ]]; then
              echo "No ${workflow} run found for ${SHA}" >&2
              exit 1
            fi
            gh run watch "$RUN_ID" --exit-status --compact
            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')
            if [[ "$CONCLUSION" != success ]]; then
              echo "${workflow} did not succeed for ${SHA}: ${CONCLUSION}" >&2
              exit 1
            fi
          done

      - name: Set up toolchain
        uses: jdx/mise-action@v4.2.0

      - name: Install cargo-edit
        run: cargo install cargo-edit --version 0.13.9 --locked

      - name: Bump package versions
        run: |
          cargo set-version --workspace "$VERSION"
          pnpm --recursive --include-workspace-root version "$VERSION" --no-git-checks --no-git-tag-version

      - name: Update lockfile
        run: cargo update --workspace

      - name: Commit and push release
        uses: evanpurkhiser/workflows/actions/commit-and-push@main
        with:
          stage-script: git add Cargo.toml Cargo.lock package.json packages/app/package.json
          branch: main
          commit-message: release v${{ inputs.version }}
          tag: v${{ inputs.version }}

      - name: Dispatch publish workflow for tag
        run: gh workflow run release.yml --ref "v${VERSION}"
